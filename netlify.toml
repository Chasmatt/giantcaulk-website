# Astro build — Netlify auto-detects but declared explicitly here so it's
# also documentation.
[build]
  command = "npm run build"
  publish = "dist"

# Astro builds directory URLs (/thanks/), so route legacy /thanks.html and
# /thanks straight there — avoids a double-redirect chain during form POST.
[[redirects]]
  from = "/thanks.html"
  to = "/thanks/"
  status = 301
  force = true

[[redirects]]
  from = "/thanks"
  to = "/thanks/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
