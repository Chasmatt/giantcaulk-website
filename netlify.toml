# Static site — no build step required.
[build]
  publish = "."

# Netlify serves thanks.html at /thanks by default, which is what the
# form's action attribute points at. This makes that explicit.
[[redirects]]
  from = "/thanks.html"
  to = "/thanks"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
