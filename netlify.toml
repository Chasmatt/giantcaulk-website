# Astro build — Netlify auto-detects but declared explicitly here so it's
# also documentation.
[build]
  command = "npm run build"
  publish = "dist"

# Legacy alias for /thanks.html → the Astro-built directory URL. We do NOT
# redirect /thanks → /thanks/ here — Netlify's own pretty-URL logic handles
# that, and adding a `force = true` redirect on top creates an infinite loop
# when the target URL gets its trailing slash normalized off internally.
[[redirects]]
  from = "/thanks.html"
  to = "/thanks/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
