# Astro build — Netlify auto-detects but declared explicitly here so it's
# also documentation.
[build]
  command = "npm run build"
  publish = "dist"

# Netlify serves thanks/index.html at /thanks by default; making the alias
# explicit in case anyone lands on /thanks.html directly.
[[redirects]]
  from = "/thanks.html"
  to = "/thanks"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
